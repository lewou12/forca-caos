# Config usada apenas em testes locais e no CI.
# O database_id e um placeholder: os dados ficam em .wrangler/state e nunca
# tocam a producao. Em producao o binding "DB" e configurado no dashboard do
# Cloudflare Pages (Settings > Bindings > D1 database bindings).
name = "forca-caos-test"
compatibility_date = "2025-04-01"
pages_build_output_dir = "public"

[[d1_databases]]
binding = "DB"
database_name = "forca-caos-local"
database_id = "00000000-0000-0000-0000-000000000000"
