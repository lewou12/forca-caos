name: Deploy Cloudflare Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-pages
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    name: Testar e publicar
    runs-on: ubuntu-latest
    timeout-minutes: 25

    env:
      CI: 'true'
      WRANGLER_SEND_METRICS: 'false'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Testes
        run: npm test

      - name: Verificacoes estaticas
        run: npm run check

      - name: Validar credenciais Cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "${CLOUDFLARE_API_TOKEN}" ]; then
            echo "::error::Secret CLOUDFLARE_API_TOKEN ausente."
            exit 1
          fi
          if [ -z "${CLOUDFLARE_ACCOUNT_ID}" ]; then
            echo "::error::Secret CLOUDFLARE_ACCOUNT_ID ausente."
            exit 1
          fi

      - name: Garantir banco D1 e binding
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: node scripts/ensure-d1.mjs forca-caos-db

      - name: Aplicar migracoes no D1 remoto
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler d1 execute forca-caos-db --remote --file=migrations/0001_init.sql

      - name: Criar projeto Pages se necessario
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if ! npx wrangler pages project list 2>&1 | tee /tmp/pages-projects.log | grep -q "forca-caos"; then
            npx wrangler pages project create forca-caos --production-branch=main
          else
            echo "Projeto Pages forca-caos ja existe."
          fi

      - name: Fixar binding D1 no projeto Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          DB_ID=$(grep -oP 'database_id\s*=\s*"\K[^"]+' wrangler.toml | head -n1)
          if [ -z "$DB_ID" ]; then
            echo "::error::database_id nao encontrado no wrangler.toml."
            exit 1
          fi
          curl -sS --fail-with-body -X PATCH \
            "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/pages/projects/forca-caos" \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            -H "Content-Type: application/json" \
            --data "{\"deployment_configs\":{\"production\":{\"d1_databases\":{\"DB\":{\"id\":\"${DB_ID}\"}}}}}" \
            -o /tmp/pages-binding.json
          node -e "const r=require('/tmp/pages-binding.json'); if(!r.success){console.error(JSON.stringify(r.errors)); process.exit(1)} console.log('Binding DB ->', r.result?.deployment_configs?.production?.d1_databases?.DB?.id)"

      - name: Publicar no Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler pages deploy public --project-name=forca-caos --branch=main --commit-dirty=true

      - name: Verificar producao
        run: |
          for attempt in $(seq 1 20); do
            body=$(curl -fsS https://forca-caos.pages.dev/api/health || true)
            if echo "$body" | grep -q '"db":"ok"'; then
              echo "Health check OK na tentativa ${attempt}: ${body}"
              exit 0
            fi
            sleep 3
          done
          echo "::error::Health check falhou em https://forca-caos.pages.dev/api/health"
          exit 1

      - name: Resumo
        run: |
          echo "### Deploy concluido" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "- Projeto: forca-caos" >> "$GITHUB_STEP_SUMMARY"
          echo "- URL: https://forca-caos.pages.dev" >> "$GITHUB_STEP_SUMMARY"
          echo "- D1: forca-caos-db" >> "$GITHUB_STEP_SUMMARY"
