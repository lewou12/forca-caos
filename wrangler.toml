name = "forca-caos"
compatibility_date = "2025-04-01"
pages_build_output_dir = "public"

# O deploy de producao e feito pela integracao Git do Cloudflare Pages
# (merge/push na branch main). O binding D1 "DB" e configurado no dashboard
# do Pages em Settings > Bindings > D1 database bindings, apontando para o
# banco "forca-caos-db". Para desenvolvimento local usamos a flag --d1 no
# script `npm run dev`, portanto nenhum database_id fica versionado aqui.
